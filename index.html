<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=El+Messiri:wght@700&display=swap">
<style>
:root{--bg:#eef4ff;--surface:#fff;--text:#0f1f3d;--muted:#64748b;--line:#dbe5f6;--blue:#1d5bd8;--blue-ink:#fff;--blue-soft:#e4eeff;--green:#16a34a;--red:#dc2626;--ing:#dcfce7;--ingt:#166534;--expg:#fee2e2;--expt:#991b1b;--track:#dbe5f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1730;--surface:#12244a;--text:#e8efff;--muted:#9fb1d6;--line:#233a6b;--blue:#5b9bff;--blue-ink:#07163a;--blue-soft:#1b3470;--green:#4ade80;--red:#f87171;--ing:#12402a;--ingt:#86efac;--expg:#4a1d24;--expt:#fca5a5;--track:#233a6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1730;--surface:#12244a;--text:#e8efff;--muted:#9fb1d6;--line:#233a6b;--blue:#5b9bff;--blue-ink:#07163a;--blue-soft:#1b3470;--green:#4ade80;--red:#f87171;--ing:#12402a;--ingt:#86efac;--expg:#4a1d24;--expt:#fca5a5;--track:#233a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.banner{background:linear-gradient(135deg,#1d5bd8,#0a3a9e);color:#fff;padding:16px 16px 34px}
.bi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;flex:none}
.banner h1{margin:0;font-family:"El Messiri","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-weight:700;font-size:2.1rem;line-height:1.15}
.banner small{opacity:.9;font-size:.85rem}
.datepill{margin-inline-start:auto;background:rgba(0,20,80,.35);padding:6px 12px;border-radius:20px;font-size:.8rem;white-space:nowrap}
.wrap{background:var(--bg);border-radius:22px 22px 0 0;margin:-18px auto 0;max-width:720px;position:relative;padding:16px 14px 110px}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:#2d4fe0;color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.hero p{margin:0;opacity:.9}
.hero .big{font-size:2.2rem;font-weight:700;opacity:1;line-height:1.3}
.hico{font-size:2.4rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat.i{background:var(--ing);color:var(--ingt)}
.stat.o{background:var(--expg);color:var(--expt)}
.stat p{margin:0;font-size:.85rem}
.stat b{font-size:1.25rem}
.arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.stat.i .arr{background:var(--green)}.stat.o .arr{background:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}
.lbl{color:var(--muted);font-size:.88rem;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:500}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:700}
.btn.grn{background:var(--green);color:#052e16;border-color:var(--green);font-weight:700}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn.danger{color:var(--red)}
.btn.wide{width:100%}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.link{border:0;background:none;color:var(--blue);font-weight:500}
.tx{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none}
.tx .info{flex:1;min-width:0}
.tx .info b{display:block;font-weight:500}
.tx .info span{color:var(--muted);font-size:.82rem;display:block;overflow-wrap:anywhere}
.tx .amt{font-weight:700;white-space:nowrap;padding-top:6px}
.acts{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px}
.chip.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
label.f{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 4px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:16px 0}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.item{margin:12px 0}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px}
.monthbar button{border:0;background:none;font-size:1.4rem;padding:2px 10px;color:var(--blue)}
.donutrow{display:flex;align-items:center;gap:14px}
.donut{width:150px;height:150px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.3}
.donut .mid b{font-size:1.2rem;color:var(--text)}
.legend{flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.9rem}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 10px;color:var(--muted);font-size:.72rem;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:0}
nav button svg{display:block;margin-bottom:2px}
nav button.on{color:var(--blue);font-weight:700}
nav .fab{flex:none;width:58px;height:58px;border-radius:50%;background:var(--blue);color:var(--blue-ink);font-size:2rem;padding:0;margin:0 4px 14px;justify-content:center;box-shadow:0 4px 14px rgba(29,91,216,.45)}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.fs{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:30}
.fhead{background:linear-gradient(135deg,#1d5bd8,#0a3a9e);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px}
.fhead.green{background:#16a34a}
.fhead .hi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.fhead h2{margin:0;flex:1;text-align:center;font-size:1.25rem;padding-inline-end:40px}
.fhead button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.fbody{max-width:720px;margin:-18px auto 0;padding:0 14px calc(30px + env(safe-area-inset-bottom,0px))}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.stepper{display:flex;margin-bottom:14px}
.st{flex:1;text-align:center;position:relative;color:var(--muted);font-size:.82rem}
.st b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#9aa8c4;color:#fff;margin:0 auto 4px;position:relative;z-index:1}
.st.cur b,.st.done b{background:var(--blue)}
.st.cur{color:var(--blue);font-weight:700}
.st:not(:last-child)::after{content:"";position:absolute;top:16px;right:50%;width:100%;height:3px;background:var(--line)}
.st.cur:not(:last-child)::after,.st.done:not(:last-child)::after{background:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 8px;text-align:center;font-weight:500}
.tile .e{font-size:1.9rem;display:block}
.tile small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.tile.on{border-color:var(--blue);background:var(--blue-soft)}
.tile.on::before{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--blue-ink);font-size:.8rem;display:grid;place-items:center}
.tile.add{color:var(--blue);border-style:dashed}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sum div:first-child{border-top:0}
.err{color:var(--red);margin:8px 0 0;min-height:1.4em}
.warn{color:var(--red);font-size:.9rem}
.bigico{width:76px;height:76px;border-radius:50%;background:var(--ing);display:grid;place-items:center;font-size:2.4rem;margin:0 auto 6px}
.cur{position:relative}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:right}
.mrow:first-child{border-top:0}
.mi{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;font-size:1.2rem;flex:none}
.mrow>span:nth-child(2){flex:1}
.chev{color:var(--muted);font-size:1.3rem}
.mrow select{width:auto}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--track);border:0;padding:0;position:relative;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s}
.sw input:checked{background:var(--blue)}
.sw input:checked::after{right:23px}
.setrow{padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.ico{width:52px!important;text-align:center;flex:none;padding:10px 4px}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.links label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:.88rem}
.links input{width:auto}
textarea{min-height:90px;font-size:.8rem;direction:ltr;text-align:left}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;font-size:.78rem}.seg button svg{width:18px;height:18px}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.mi svg{width:20px;height:20px;color:var(--blue)}
.noauth nav{display:none}
.noauth .wrap{padding-bottom:30px}
.pfx{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);flex:none}
.pwrow{position:relative}
.pwrow input{padding-inline-end:70px}
.pwt{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-size:.85rem;padding:6px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:1.5rem;font-weight:700;flex:none}
.okm{color:var(--green);margin:8px 0}
.btn svg{vertical-align:middle;margin-inline-end:6px}
.authlinks{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;inset-inline:16px;bottom:96px;background:#0f1f3d;color:#fff;padding:10px 14px;border-radius:12px;z-index:50;display:none;text-align:center;font-size:.9rem}
.thmwrap{position:relative;margin-bottom:10px}
.thmbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--blue);display:grid;place-items:center}
.thm{position:absolute;inset-inline-end:0;top:48px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;gap:6px;z-index:6;box-shadow:0 6px 18px rgba(0,20,80,.2)}
.thm button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.thm button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fs.exp{--blue:#dc2626;--blue-ink:#fff;--blue-soft:color-mix(in srgb,#dc2626 14%,var(--surface))}
.fhead.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.btn.redb{background:#dc2626;color:#fff;border-color:#dc2626;font-weight:700}
.btn.grnw{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:700}
.fpbtn{display:grid;place-items:center;margin:14px auto 0;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--blue);background:var(--blue-soft);color:var(--blue)}
.fpbtn svg{width:30px;height:30px}
.pwt svg{width:22px;height:22px;display:block}
.sw.bio input:checked{background:var(--green)}
.pdrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pdrow:first-child{border-top:0}
.thm{transform-origin:21px -27px;animation:thmIn .18s ease-out}
.thm.out{animation:thmOut .17s ease-in forwards}
@keyframes thmIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes thmOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion:reduce){.thm,.thm.out{animation:none}}
</style>
</head>

  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="97" rx="24" fill="#ffffff" stroke="#1d5bd8" stroke-width="3"/><rect x="22" y="40" width="16" height="30" rx="4" fill="#16a34a"/><rect x="42" y="24" width="16" height="46" rx="4" fill="#1d5bd8"/><rect x="62" y="48" width="16" height="22" rx="4" fill="#dc2626"/><line x1="14" y1="74" x2="86" y2="74" stroke="#1d5bd8" stroke-width="4" stroke-linecap="round"/><polygon points="50,78 42,90 58,90" fill="#1d5bd8"/></svg>

</nav>

var $=function(i){return document.getElementById(i)};
function fom(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){var d=new Date();return ym(d)+"-"+pad(d.getDate())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(n){return Number(n).toLocaleString("en-US",{maximumFractionDigits:2})}

function fdate(s){return new Date(s+"T00:00").toLocaleDateString("ar-u-nu-latn",{day:"numeric",month:"short",year:"numeric"})}

function fnd(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}

 S.sources.forEach(function(s,i){if(!s.icon)s.icon=ISRC[i%ISRC.length]});S.cats.forEach(function(c,i){if(!c.icon)c.icon=ICAT[i%ICAT.length]});if(!S.theme)S.theme="auto";if(!S.country)S.country="ليبيا";if(!S.cur)S.cur="د.ل"}

function txRow(t,acts){
  var inc=t.type==="in",bg=inc?"#16a34a22":ccolor(t.cat)+"22";
  var h='<div class="tx"><span class="ci" style="background:'+bg+'">'+esc(inc?sicon(t.src):cicon(t.cat))+'</span><div class="info"><b>'+(inc?"دخل من "+esc(sname(t.src)):esc(cname(t.cat)))+'</b><span>'+(inc?"":esc(sname(t.src))+" · "+(t.kind?esc(t.kind)+" · ":""))+dlabel(t.date)+'</span>'+(t.note?'<span>'+esc(t.note)+'</span>':'');
  if(acts){
    if(CONF==="tx:"+t.id)h+='<div class="acts"><span class="warn">حذف هذه العملية نهائيًا؟</span><button class="btn sm danger" data-a="yes">نعم، احذف</button><button class="btn sm" data-a="no">إلغاء</button></div>';
    else h+='<div class="acts"><button class="btn sm" data-a="edit" data-id="'+t.id+'">تعديل</button><button class="btn sm danger" data-a="del" data-k="tx:'+t.id+'">حذف</button></div>';
  }
  return h+'</div><div class="amt '+(inc?"up":"down")+'"><span dir="ltr">'+(inc?"+":"-")+money(t.amount)+'</span></div></div>';
}

function donut(map,total){
  var ks=Object.keys(map).sort(function(a,b){return map[b]-map[a]}),acc=0,segs="";
  if(!ks.length)segs='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--track)" stroke-width="6"/>';
  ks.forEach(function(k){var p=map[k]/total*100;segs+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+ccolor(k)+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(-acc)+'"/>';acc+=p});
  var leg=ks.map(function(k){return '<div><i style="background:'+ccolor(k)+'"></i><span>'+esc(cname(k))+'</span><b>'+Math.round(map[k]/total*100)+'%</b></div>'}).join("");
  return '<div class="donutrow"><div class="donut"><svg viewBox="0 0 42 42">'+segs+'</svg><div class="mid"><b>'+num(total)+'</b>'+esc(S.cur)+'<br>المصروف</div></div><div class="legend">'+(leg||'<div class="lbl">لا توجد مصروفات في هذا الشهر.</div>')+'</div></div>';
}

  return h;

/* ---------- العمليات ---------- */
async function doLogin(){
  var c=$("sgc").value,ph=normPhone($("aphone").value),pw=$("apw").value;
  if(!ph){aerr("أدخل رقم الهاتف.");return}
  if(!pw){aerr("أدخل كلمة المرور.");return}
  aerr("جاري الدخول...");
  try{
    var j=await sb("/auth/v1/token?grant_type=password",{m:"POST",b:{email:emailOf(DIAL[c],ph),password:pw}});
    setSes(j);BOOT=true;render();await enter();
  }catch(e){
    BOOT=false;render();
    if(e.status===400||e.code==="invalid_credentials")aerr("رقم الهاتف أو كلمة المرور غير صحيحة.");
    else aerr("تعذّر الاتصال بالخادم: "+e.message);
  }
}
async function doSignup(){
  var name=$("sgn").value.trim(),c=$("sgc").value,ph=normPhone($("aphone").value),pw=$("apw").value,pw2=$("apw2").value,em=$("aem").value.trim();
  if(!name){aerr("أدخل اسمك.");return}
  if(ph.length<6||ph.length>12){aerr("رقم الهاتف غير صحيح.");return}
  if(!pwOk(pw)){aerr(PWMSG);return}
  if(pw!==pw2){aerr("كلمتا المرور غير متطابقتين.");return}
  if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){aerr("البريد الإلكتروني غير صحيح.");return}
  aerr("جاري إنشاء الحساب...");
  try{
    var meta={name:name,country:c,dial:DIAL[c],phone:ph,email:em};
    var j=await sb("/auth/v1/signup",{m:"POST",b:{email:emailOf(DIAL[c],ph),password:pw,data:meta}});
    if(!j||!j.access_token){aerr("يجب إيقاف خيار Confirm email في إعدادات Supabase (Authentication ثم Sign In / Providers ثم Email).");return}
    setSes(j);
    var guest=null;try{guest=JSON.parse(localStorage.getItem(K))}catch(e){}
    S=(guest&&guest.tx&&guest.tx.length)?guest:def();S.country=c;S.cur=currencyOf(c);fixS();
    var t=j.access_token;
    await sb("/rest/v1/profiles?on_conflict=id",{m:"POST",tok:t,prefer:"resolution=merge-duplicates,return=minimal",b:{id:j.user.id,name:name,country:c,dial:DIAL[c],phone:ph,email:em}});
    U={id:j.user.id,name:name,country:c,dial:DIAL[c],phone:ph,email:em};
    await pushNow();startApp();
  }catch(e){
    if(e.code==="user_already_exists"||/already/i.test(e.message))aerr("هذا الرقم مسجل مسبقًا. سجّل الدخول.");
    else aerr("تعذّر إنشاء الحساب: "+e.message);
  }
}
async function signOut(){
  var keep=U&&localStorage.getItem("mizan-bio:"+U.id);
  if(!keep){try{if(SES)await sb("/auth/v1/logout",{m:"POST",tok:SES.at})}catch(e){}clearSes()}
  U=null;G=false;LOCK=false;BOOT=false;AV="login";MSG2="";P="home";load();render();window.scrollTo(0,0);
}
async function acctSave(){
  var n=$("pn").value.trim(),c=$("pc").value,em=$("pe").value.trim();
  if(!n){MSG2="أدخل الاسم.";render();return}
  if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){MSG2="البريد الإلكتروني غير صحيح.";render();return}
  try{
    var t=await tok();
    await sb("/rest/v1/profiles?id=eq."+U.id,{m:"PATCH",tok:t,prefer:"return=minimal",b:{name:n,country:c,email:em}});
    U.name=n;U.email=em;if(U.country!==c){U.country=c;S.country=c;S.cur=currencyOf(c);save()}
    MSG2="تم حفظ التغييرات.";PDEDIT=false;
  }catch(e){MSG2="تعذّر الحفظ: "+e.message}
  render();
}
async function pwChange(){
  var o=$("opw").value,n=$("npw").value;
  if(!pwOk(n)){MSG2=PWMSG;render();return}
  try{
    await sb("/auth/v1/token?grant_type=password",{m:"POST",b:{email:emailOf(U.dial,U.phone),password:o}});
  }catch(e){MSG2="كلمة المرور الحالية غير صحيحة.";render();return}
  try{
    var t=await tok();await sb("/auth/v1/user",{m:"PUT",tok:t,b:{password:n}});MSG2="تم تغيير كلمة المرور.";PWOPEN=false;
  }catch(e){MSG2="تعذّر تغيير كلمة المرور: "+e.message}
  render();
}

/* ---------- البصمة: قفل للتطبيق على هذا الجهاز عبر WebAuthn ---------- */
async function bioEnable(){
  BIOP=false;
  try{
    var cr=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"ميزان"},user:{id:new TextEncoder().encode(U.id),name:U.dial+U.phone,displayName:U.name},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
    localStorage.setItem("mizan-bio:"+U.id,b64(cr.rawId));MSG2="تم تفعيل الدخول بالبصمة.";
  }catch(e){MSG2=bioMsg(e)}
  render();sheet();
}
function bioDisable(){try{localStorage.removeItem("mizan-bio:"+U.id)}catch(e){}MSG2="تم إيقاف الدخول بالبصمة.";render()}
async function bioLogin(){
  var cred=SES&&localStorage.getItem("mizan-bio:"+SES.uid);
  if(!cred){aerr("لم يتم تفعيل البصمة على هذا الجهاز.");return}
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(cred)}],userVerification:"required",timeout:60000}})}catch(e){aerr(bioMsg(e));return}
  LOCK=false;BOOT=true;render();
  try{await enter()}catch(e){fail(e)}
}

  if(e.key==="Enter"&&!U&&!G&&e.target.tagName==="INPUT"){var b=document.querySelector('[data-a="login"],[data-a="signup"]');if(b)b.click()}
});
try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){BIOK=!!v;if(U||!document.activeElement||document.activeElement.tagName!=="INPUT")render()}).catch(function(){})}catch(e){}
try{G=localStorage.getItem("mizan-guest")==="1"&&!localStorage.getItem("mizan-ses")}catch(e){}
load();applyTheme();render();bootCloud();
</script>
